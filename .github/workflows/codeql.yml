name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-24.04
            build-mode: none
          - language: javascript-typescript
            runner: ubuntu-24.04
            build-mode: none
          - language: java-kotlin
            runner: ubuntu-24.04
            build-mode: none
          - language: swift
            runner: macos-latest
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'swift'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - name: Prepare the iOS demo and local plugin dependency
        if: matrix.language == 'swift'
        run: |
          npm ci
          npm run build
          npm ci --prefix demo
          npm run build:rendering --prefix demo
          cd demo
          npx cap sync ios
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Swift for iOS Simulator
        if: matrix.language == 'swift'
        run: >-
          xcodebuild
          -project demo/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath '${{ runner.temp }}/codeql-ios'
          CODE_SIGNING_ALLOWED=NO
          COMPILATION_CACHE_ENABLE_CACHING=NO
          SWIFT_ENABLE_COMPILE_CACHE=NO
          build
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
