name: Compatibility

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --allowOnly=false

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: demo
      - run: npm run typecheck
        working-directory: demo
      - run: npx playwright install --with-deps chromium webkit
        working-directory: demo
      - run: npm run test:workers -- --allowOnly=false
        working-directory: demo
      - run: npm run build
        working-directory: demo
      - run: npm run test:browser
        working-directory: demo
      - run: npm run test:runtime
        working-directory: demo
      - run: npm run test:runtime:dev
        working-directory: demo
      - run: npm run test:build-tools
        working-directory: demo

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:package

  required:
    name: CI
    if: ${{ always() }}
    needs: [library, compatibility, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        env:
          LIBRARY: ${{ needs.library.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$LIBRARY" = success
          test "$COMPATIBILITY" = success
          test "$PACKAGE" = success
